<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Video Game Library</title>

<style>

body {

  font-family: Arial, Helvetica, sans-serif;

  max-width: 720px;

  margin: 0 auto;

  padding: 16px;

  line-height: 1.4;

  color: #222222;

}

h1 {

  margin-top: 0;

}

h2 {

  margin-top: 0;

}

section {

  border: 1px solid #999999;

  padding: 12px 16px;

  margin-bottom: 16px;

}

ul {

  list-style: none;

  margin: 0;

  padding: 0;

}

li {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  padding: 6px 0;

  border-bottom: 1px solid #dddddd;

}

button {

  padding: 6px 12px;

  margin-left: 6px;

  cursor: pointer;

}

label {

  display: block;

  margin-top: 10px;

}

input, select {

  width: 100%;

  max-width: 320px;

  padding: 6px;

  box-sizing: border-box;

}

form button {

  display: block;

  margin: 14px 0 0;

}

#message {

  position: sticky;

  top: 0;

  padding: 8px 12px;

  background: #fff3cd;

  border: 1px solid #c9a400;

  font-weight: bold;

}

#message:empty {

  display: none;

}

</style>

</head>

<body>

<h1>My Video Game Library</h1>

<p id="message" role="status"></p>

<section>

<h2>My games</h2>

<p id="count"></p>

<ul id="game-list"></ul>

</section>

<section>

<h2>Game details</h2>

<div id="details"></div>

</section>

<section>

<h2>Add a game</h2>

<form id="add-form" novalidate>

<label for="add-title">Title</label>

<input id="add-title" type="text">

<label for="add-platform">Platform</label>

<input id="add-platform" type="text">

<label for="add-genre">Genre</label>

<input id="add-genre" type="text">

<label for="add-hours">Hours played</label>

<input id="add-hours" type="number" min="0">

<button type="submit">Add game</button>

</form>

</section>

<section>

<h2>Update a game</h2>

<form id="update-form" novalidate>

<label for="update-game">Game</label>

<select id="update-game"></select>

<label for="update-field">What to change</label>

<select id="update-field">

<option value="title">Title</option>

<option value="platform">Platform</option>

<option value="genre">Genre</option>

<option value="hours">Hours played</option>

</select>

<label for="update-value">New value</label>

<input id="update-value" type="text">

<button type="submit">Update game</button>

</form>

</section>

<script src="script.js"></script>

</body>

</html>
