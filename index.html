<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Run Through the Park</title>

    <style>

        body {

            margin: 0;

            padding: 24px 16px 40px;

            background: #eef3e6;

            color: #1f3a2b;

            font-family: "Trebuchet MS", "Segoe UI", sans-serif;

            line-height: 1.5;

        }

        main {

            max-width: 800px;

            margin: 0 auto;

        }

        h1 {

            margin: 0 0 8px;

            font-size: 2rem;

            line-height: 1.15;

        }

        p {

            margin: 0 0 16px;

        }

        .controls {

            display: flex;

            gap: 10px;

        }

        button {

            padding: 10px 20px;

            border: 2px solid #2f6b3f;

            border-radius: 6px;

            background: #2f6b3f;

            color: #ffffff;

            font: inherit;

            font-weight: bold;

            cursor: pointer;

        }

        button.stop {

            background: transparent;

            color: #2f6b3f;

        }

        button:focus-visible {

            outline: 3px solid #1d4ed8;

            outline-offset: 2px;

        }

        #park {

            position: relative;

            width: 100%;

            aspect-ratio: 3 / 2;

            overflow: hidden;

            border-radius: 10px;

            background-size: cover;

            background-position: center;

        }

        #park img {

            position: absolute;

            height: auto;

            user-select: none;

            transform: scaleX(-1);

        }

        #friend {

            filter: hue-rotate(-50deg) saturate(1.3);

        }

        .credit {

            margin: 16px 0 0;

            font-size: 0.85rem;

        }

    </style>

    <script src="movingCharacter.js" defer></script>

</head>

<body>

    <main>

        <h1>Run Through the Park</h1>

        <p>Press Move It! to send two runners west across the park.</p>

        <p class="controls">

            <button onclick="move()">Move It!</button>

            <button class="stop" onclick="stopMoving()">Stop!</button>

        </p>

        <div id="park">

            <img id="friend" alt="Runner in a teal shirt running west" draggable="false">

            <img id="boy" alt="Boy in a blue shirt running west" draggable="false">

        </div>

        <p class="credit">Runner sprites from <a href="https://www.reinerstilesets.de/">Reiner's Tilesets</a>.</p>

    </main>

</body>

</html>
