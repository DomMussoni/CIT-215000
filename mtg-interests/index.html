<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic: The Gathering - Color Identity Guide</title>
  <script src="jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
  <h1 id="title">Magic: The Gathering - Color Identity Guide</h1>
  <p id="tagline">Click a color to see what it's about.</p>

  <div id="controls">
    <button class="color-btn" data-key="W">White</button>
    <button class="color-btn" data-key="U">Blue</button>
    <button class="color-btn" data-key="B">Black</button>
    <button class="color-btn" data-key="R">Red</button>
    <button class="color-btn" data-key="G">Green</button>
    <button class="color-btn" data-key="C">Colorless</button>
  </div>

  <div id="display">
    <p id="placeholder">Pick a color above.</p>
  </div>
</body>
</html>
