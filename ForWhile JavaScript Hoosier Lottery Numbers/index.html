<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Hoosier Lottery Nums</title>

</head>

<body>

  <h1 id="forlooping"></h1>

  <h1 id="whileLooping"></h1>

  <script>

    let forLoopString = "";

    for (let i = 1; i <= 6; i++) {

      let randomNum = Math.floor(Math.random() * 49) + 1;

      console.log(randomNum);

      forLoopString = forLoopString + randomNum + " ";

    }

    document.getElementById("forlooping").innerHTML = "For Loop Lottery Nums: " + forLoopString;

    let whileLoopString = "";

    let count = 0;

    while (count < 6) {

      let randomNum = Math.floor(Math.random() * 49) + 1;

      console.log(randomNum);

      whileLoopString = whileLoopString + randomNum + " ";

      count = count + 1;

    }

    document.getElementById("whileLooping").innerHTML = "While Loop Lottery Nums: " + whileLoopString;

  </script>

</body>

</html>
